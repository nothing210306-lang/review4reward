<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191970">
<title>Sign in · Review for Reward</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23191970'/><polygon points='16,6 18,13 26,13 20,18 22,26 16,21 10,26 12,18 6,13 14,13' fill='%23FFD700'/></svg>">
</head>
<body style="background:#ffffff">

<main class="auth-minimal">
  <div class="auth-minimal__card">
    {% if error %}
    <div class="alert alert--error" style="margin-bottom:20px">
      <span class="ico">!</span>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    {% if prod_no_auth %}
    <div class="alert alert--warn" style="margin-bottom:20px">
      <span class="ico">!</span>
      <div>Authentication is being configured. Please check back shortly.</div>
    </div>
    {% elif dev_google %}
    <form method="post" action="/auth/google/dev" class="auth-minimal__form">
      <div class="field">
        <label for="email">Google account email (dev mode)</label>
        <input type="email" id="email" name="email" required placeholder="you@envisys.com" autofocus>
      </div>
      <button class="btn btn--primary btn--block btn--lg" type="submit">Continue</button>
    </form>
    {% else %}
    <a class="btn-google" href="/auth/google/login">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.5 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.9c-.3 1.4-1 2.6-2.2 3.4v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8z"/>
        <path fill="#34A853" d="M12 23c2.9 0 5.4-1 7.2-2.6l-3.6-2.8c-1 .7-2.3 1.1-3.6 1.1-2.8 0-5.2-1.9-6-4.4H2.3v2.9C4.1 20.6 7.8 23 12 23z"/>
        <path fill="#FBBC05" d="M6 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.8H2.3C1.5 8.4 1 10.1 1 12s.5 3.6 1.3 5.2L6 14.3z"/>
        <path fill="#EA4335" d="M12 5.4c1.6 0 3 .5 4.1 1.6l3.1-3.1C17.4 2.1 14.9 1 12 1 7.8 1 4.1 3.4 2.3 6.8L6 9.6c.8-2.5 3.2-4.2 6-4.2z"/>
      </svg>
      <span>Sign in with Google</span>
    </a>
    {% endif %}

    <p class="auth-minimal__note">
      By continuing you agree this portal is for authorized review collection.
    </p>
  </div>

  <a href="/" class="auth-minimal__back">← Back</a>
</main>

<style>
  body { background: #fff; }
  .auth-minimal {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .auth-minimal__card {
    width: 100%;
    max-width: 380px;
    background: #fff;
  }
  .auth-minimal__brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-minimal__brand .logo {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: #191970;
    display: inline-grid;
    place-items: center;
    margin-bottom: 18px;
  }
  .auth-minimal__brand h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #191970;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .auth-minimal__brand p {
    color: #666;
    font-size: 14px;
    margin: 0;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px 20px;
    background: #fff;
    color: #1f1f1f;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all .15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .btn-google:hover {
    border-color: #c6cad0;
    box-shadow: 0 2px 8px rgba(60,64,67,0.12);
    transform: translateY(-1px);
    color: #1f1f1f;
    background: #fff;
  }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-google span { letter-spacing: 0; }

  .auth-minimal__note {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #999;
    line-height: 1.5;
  }
  .auth-minimal__back {
    margin-top: 28px;
    font-size: 13px;
    color: #191970;
    text-decoration: none;
    font-weight: 500;
  }
  .auth-minimal__back:hover { text-decoration: underline; }

  .auth-minimal__form .btn { margin-top: 8px; }
</style>

</body>
</html>
